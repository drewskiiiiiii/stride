<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stride — Running Coach</title>
  <meta name="description" content="A personal, offline-first running coach: personalised training plans, guided interval workouts and progress tracking.">
  <meta name="theme-color" content="#0a0b0d">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stride">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/calendar.css">
  <link rel="stylesheet" href="css/workout.css">
  <script>
    // apply theme before first paint
    try { var p = JSON.parse(localStorage.getItem('stride.prefs') || '{}'); if (p.theme) document.documentElement.dataset.theme = p.theme; } catch (e) {}
  </script>
</head>
<body>
  <div id="app"><div style="min-height:100vh;display:grid;place-items:center;color:#8c93a0;font-family:system-ui">Loading…</div></div>
  <noscript><p style="padding:24px">Stride needs JavaScript enabled.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
